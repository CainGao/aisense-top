function filterPosts(type) {
    const list = document.getElementById('postList');
    const filtered = type === 'all' ? posts : posts.filter(p => p.type === type);
    list.innerHTML = filtered.map(p => `
        <a href="${p.url}" class="news-item">
            <div class="news-date-badge">${p.date}</div>
            <div class="news-content">
                <div class="news-title">${p.title}</div>
                <div class="news-meta">${p.typeLabel}</div>
            </div>
        </a>
    `).join('');
    if (filtered.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:40px;">No posts found.</p>';
    }
}

filterPosts('all');
